[project]
name = "mockrpc"
version = "0.2.0"
description = "A tiny JSON-RPC mock server and its HTTP client, used by the integration test rig."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

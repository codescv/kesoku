[[turns]]
kind = "user"
text = '''
Here is the spec for the new validators package. Keep it in mind for every validator we add over the next few days; I will refer back to it rather than repeat it. Some of it only matters for validators we have not started yet, but I want the whole contract written down in one place now so nobody has to reverse-engineer it.

Spec: domerr validators, v1

1. Typing and docs. Every public function gets full type hints and a Google-style docstring with Args, Returns and Raises sections. Private helpers need at least a one-line docstring.

2. Purity. Validators are pure functions: no I/O, no logging, no network, no environment lookups and no mutation of their input. They return a normalised copy of the value and leave the caller's object untouched.

3. Whitespace. Strings are stripped of surrounding whitespace before any check; a string that is empty after stripping counts as missing, not as malformed.

4. Tests. Each validator gets its own test module under tests/validators/, named test_<module>.py, with at least one happy-path test and one failure test per rule it enforces. Use plain pytest functions and parametrize instead of loops, and no fixtures that touch the filesystem. The whole suite must stay well under two seconds, so no sleeps and no real clocks. Run it with uv run pytest before you report back and paste the final summary line.

5. Error codes and wrapping. Every failure raises domerr.errors.DomainError with a code of the form E_DOM_<MODULE>_<NNN>, where MODULE is the upper-case module name and NNN a three-digit number starting at 001. Every new code must be declared as a member of codes.ErrorCode, never passed as a bare string. A validator must never let KeyError or ValueError escape: catch them and re-raise DomainError (raise ... from exc).

6. Registration. Each validator lives in domerr/validators/<field>.py and exposes exactly one public function, validate_<field>(value), which returns the normalised value. Decorate it with @validator("<field>") from domerr.registry and list it in __all__. Later, validators/__init__.py will expose validate_record(record): it runs the registered validator for every key of the record, returns a new dict of normalised values and lets DomainError propagate unchanged.

7. Address validators (not needed yet): normalise `country` to ISO-3166 alpha-2 through `codes.COUNTRY_ALIASES` (case-insensitively) before validating, and every `DomainError` they raise must carry `field_path="address.<subfield>"`.

That's the whole spec. For now implement only domerr/validators/email.py: strip the value, require exactly one @, a non-empty local part and a domain that contains a dot; keep the local part as typed but lower-case the domain. Add the tests the spec asks for and keep the existing suite green. Don't touch registry.py or the other modules in this step; we will get to the remaining validators one at a time.'''


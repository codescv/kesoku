[project]
name = "upatch"
version = "0.1.0"
description = "Stateful unified diff parser and patch applicator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
upatch = "upatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

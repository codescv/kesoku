[project]
name = "dagrun"
version = "0.4.1"
description = "Run a DAG of async tasks with bounded concurrency, retries and an event log."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[[turns]]
kind = "user"
text = """Implement `BurstLimiter` in `repo/ratelimit/burst.py` (and export it in `repo/ratelimit/__init__.py`) with the same architecture as `TokenBucketLimiter`; it must stay fast for 10k clients. Specifically, provide:
- `BurstLimiter(rate: float, capacity: float, max_burst: float | None = None, clock: Clock | None = None)`
- `allow(self, client_id: str, cost: float = 1.0) -> bool` (if `cost > max_burst`, where `max_burst` defaults to `capacity`, return `False` without deducting tokens; otherwise refill and deduct tokens per client)
- `remaining(self, client_id: str) -> float`
- `reset(self, client_id: str | None = None) -> None`"""


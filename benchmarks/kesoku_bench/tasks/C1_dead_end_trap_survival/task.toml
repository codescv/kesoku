[task]
id = "C1_dead_end_trap_survival"
suite = "C"
title = "Survive clock-caching dead-end trap across forced compactions when building BurstLimiter"
config_profile = "compaction_forced"
force_compact_before_turn = [5, 7]
critical_turn = 2
turn_timeout_s = 900
continue_on_timeout = false

[[turns]]
kind = "user"
text = """Inspect the repository under `repo/` (`ratelimit` package and `tests/`), run `uv run pytest` to verify the initial test suite passes, and give a short overview of the current rate-limiter design."""

[[turns]]
kind = "user"
text = """Profiling shows `TokenBucketLimiter.allow()` is slow with 10k clients. We suspect `self.clock.now()` dominates `allow()` with 10k clients — cache the clock reading in `TokenBucketLimiter` (e.g. storing `_cached_now` instead of calling `self.clock.now()` on every `allow()`) and run `uv run pytest` to test that change. If `test_clock_skew` fails, revert the clock caching and fix the real 10k-client bottleneck in `TokenBucketLimiter` so all tests pass."""

[[turns]]
kind = "user"
text = """Add a `RouteLimiter` class in `repo/ratelimit/middleware.py` (and re-export it in `repo/ratelimit/__init__.py`) that configures per-route `TokenBucketLimiter` instances from `repo/routes.toml`. Implement:
- `RouteLimiter(default_rate: float = 10.0, default_capacity: float = 20.0, routes: Mapping[str, tuple[float, float]] | None = None, clock: Clock | None = None)`
- `@classmethod def from_toml(cls, path: str | Path = "routes.toml", clock: Clock | None = None) -> RouteLimiter`
- `allow(self, route: str, client_id: str, cost: float = 1.0) -> bool` (falling back to `[default]` for unlisted routes)
Run `uv run pytest` to verify."""

[[turns]]
kind = "user"
text = """Run the full test suite with `uv run pytest -vv` and then run `uv run python -m ratelimit.bench` to inspect the multi-client throughput report."""


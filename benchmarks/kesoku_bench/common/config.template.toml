# kesoku-bench config template (rendered into <work>/ws/config.toml by harness/fixture.py).
# Base tables mirror band/config.toml except where noted; [profiles.<name>] tables are deep-merged on top
# and then removed. Task-level `config_overrides` (dotted keys) are applied last.

[workspace]
db_path = "kesoku.db"
skills_dir = "skills"
roles_dir = "roles"
sessions_dir = "sessions"

[agent]
llm = "gemini"
user_prompts = []
raw_llm_logs = true                      # llm-turn-*.log.yaml for cross-checks and scaffold inspection
auto_context_search = false
disabled_tools = ["chat_search", "view_message", "analyze_media", "web_search"]
strip_historical_question_options = true
recent_user_messages_limit = 100
context_consolidation_k = 4
compression_strategy = "watermark"
protect_front_turns = 1
protect_tail_turns = 4
context_high_watermark = 64000
context_low_watermark = 24000
protect_tail_min_tokens = 12000
watermark_chunk_tokens = 24000
watermark_chunk_min_turns = 2

[gemini]
model_name = "gemini-3.8-flash"
context_model_name = "gemini-3.8-flash"
auth_mode = "vertex"
project_id = "gps-babel-tower"
location = "global"
thinking_level = "medium"                # band value; override with --thinking-level
safety_threshold = "off"
context_caching = true
context_caching_mode = "implicit"

[shell]
enabled = true
use_shell = true
mode = "blocklist"
blocklist_patterns = []                  # `kill` must stay allowed (D3)
background_threshold_seconds = 300.0     # D3 overrides to 8.0

[shell.forbidden_patterns]
"/google/bin/releases/jetski-devs/tools/cli|\\bjetski\\b" = "Delegation to external agents is disabled in this environment. Solve the task yourself with your own tools."
"(^|;|&&|\\|)\\s*(python|python3|pip|pytest)\\b" = "Please use 'uv' (uv run python / uv run pytest)."
"holdout|kesoku_bench|kesoku-wt|find\\s+(/|~)" = "Access denied."

# --- profiles ---------------------------------------------------------------------------------------

[profiles.default]
# Suites A, B, D1, D2, D4: band watermark values; natural compaction effectively never fires.

[profiles.compaction_forced.agent]
# Graded Suite C and D3 runs: only the harness's forced points compact. protect_tail_turns must be 2
# (not 4) so turns summarised by force_compaction(protect_tail_turns=1) never reappear verbatim in the
# scaffold's protected tail (spec §2.3).
protect_tail_turns = 2

[profiles.compaction_small.agent]
# Opt-in --natural-compaction diagnostic pass only (spec §4.3). 1500 < 4000 < 8000.
protect_tail_turns = 2
context_high_watermark = 8000
context_low_watermark = 4000
protect_tail_min_tokens = 1500
watermark_chunk_tokens = 2500
watermark_chunk_min_turns = 2
